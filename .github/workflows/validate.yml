name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate Skill contract and eval corpus
        run: python scripts/validate_skill.py . --check-git-clean --self-test-negative

      - name: Set up Node.js for Claude Code validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Validate Claude Code plugin and marketplace
        run: claude plugin validate . --strict
